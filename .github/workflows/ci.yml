name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing

  quality-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-streamlit.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/secret_scan.py --history
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-streamlit.txt
      - run: pip-audit -r requirements-dev.txt
      - run: >-
          pip-licenses --format=plain-vertical
          --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only"
