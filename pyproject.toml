[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-video"
version = "2.0.0"
description = "Authorized, credential-safe, integrity-aware Google Drive video transfer CLI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
  "requests>=2.32.5,<3",
  "tqdm>=4.67.1,<5",
]

[project.scripts]
gdrive-video = "gdrive_video.cli:run"

[tool.setuptools.packages.find]
include = ["gdrive_video*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gdrive_video"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["streamlit.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
files = ["gdrive_video", "main.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
